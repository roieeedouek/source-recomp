<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for the PS5 title (no system fonts): the fonts Portal 2 ships, a cache in the title's temporary folder, and the
     family names VGUI asks for mapped onto them. Installed as /data/portal2/fonts.conf (tools/ps5/run_title.sh). -->
<fontconfig>
  <dir>/data/portal2/game/platform/resource/linux_fonts</dir>
  <dir>/data/portal2/game/platform/vgui/fonts</dir>
  <dir>/data/portal2/game/portal2/resource</dir>
  <cachedir>/data/portal2/tmp/fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family><family>Liberation Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Times New Roman</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
